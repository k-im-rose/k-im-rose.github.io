---
layout: cv
title: 사진첩 — 김민지
permalink: /frame/
---
{% include cv-head.html active='frame' %}
<main class="sheet">

  <section class="chapter" id="frames">
    <h2>사진첩</h2>
    <p class="lede">직접 담고 편집한 장면들을 모았습니다.</p>
    {% assign items = site.data.frames.items %}
    {% if items and items.size > 0 %}
    <div class="frame-grid" id="frame-grid">
      {% for item in items %}
      <figure class="frame-item" data-ratio="{{ item.ratio }}" data-src="{{ site.data.frames.base }}/videos/{{ item.id }}.mp4">
        <button type="button" class="frame-play" aria-label="영상 재생">
          <img src="{{ site.data.frames.base }}/thumbs/{{ item.id }}.jpg" alt="" loading="lazy" decoding="async">
        </button>
      </figure>
      {% endfor %}
    </div>
    {% else %}
    <p class="lede">준비 중입니다.</p>
    {% endif %}
  </section>

  <footer class="foot">
    <span>사진첩</span>
    <a href="#top">맨 위로 ↑</a>
  </footer>
</main>

<style>
/* 줄맞춤 갤러리: 원본 비율 유지, 줄 양끝 정렬, 자동 배치 (스크립트가 계산) */
#frames .lede { margin-bottom: 28px; }
.frame-grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; border-top: 1px solid var(--rule); padding-top: 18px; }
.frame-item { margin: 0; position: relative; overflow: hidden; background: var(--hair); }
.frame-play { all: unset; cursor: pointer; display: block; width: 100%; height: 100%; }
.frame-play img { display: block; width: 100%; height: 100%; object-fit: contain; }
.frame-item video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
/* 전체 화면일 때도 세로 원본 비율을 유지하고 잘리지 않게 */
.frame-item video:fullscreen, .frame-item video:-webkit-full-screen { width: 100%; height: 100%; object-fit: contain; background: #000; }
@media (max-width: 720px) { .frame-grid { gap: 10px; } }
</style>

<script>
(function () {
  var grid = document.getElementById('frame-grid');
  if (!grid) return;
  var TARGET = function () { return 150; }; // 모바일 마지막 줄 높이
  var GAP = function () { return window.innerWidth <= 720 ? 10 : 16; };

  function layout() {
    var W = grid.clientWidth, gap = GAP();
    var items = Array.prototype.slice.call(grid.children);
    items.forEach(function (f) {
      f.r = parseFloat(f.getAttribute('data-ratio')) || 0.5625;
    });
    var wide = window.innerWidth > 720;
    var rows = [];
    if (wide) {
      // PC: 한 줄에 3개씩. 각 줄의 높이를 맞추고, 원본 비율대로 너비를 나눔
      for (var i = 0; i < items.length; i += 3) rows.push(items.slice(i, i + 3));
    } else {
      // 모바일: 목표 높이 기준으로 자동 줄바꿈
      var H0 = TARGET(), cur = [];
      items.forEach(function (f) {
        cur.push(f);
        var sum = cur.reduce(function (s, x) { return s + x.r; }, 0);
        if (sum * H0 + gap * (cur.length - 1) >= W) { rows.push(cur); cur = []; }
      });
      if (cur.length) rows.push(cur);
    }
    // PC: 마지막 줄이 3개 미만이면 위 줄과 같은 높이를 유지 (줄이 크게 늘어나지 않게)
    var refH = null;
    if (wide && rows.length && rows[0].length === 3) {
      var s0 = rows[0].reduce(function (s, x) { return s + x.r; }, 0);
      refH = (W - gap * 2 - 2) / s0; // 소수점 반올림으로 줄이 넘치지 않게 2px 여유
    }
    rows.forEach(function (row, idx) {
      var sum = row.reduce(function (s, x) { return s + x.r; }, 0);
      var h;
      if (wide) {
        h = (row.length === 3 || !refH) ? (W - gap * (row.length - 1) - 2) / sum : refH;
      } else {
        h = (idx < rows.length - 1) ? (W - gap * (row.length - 1) - 2) / sum : TARGET();
      }
      row.forEach(function (it) {
        it.style.width = (it.r * h) + 'px';
        it.style.height = h + 'px';
      });
    });
  }

  grid.addEventListener('click', function (e) {
    var btn = e.target.closest('.frame-play');
    if (!btn) return;
    var fig = btn.parentElement;
    var v = document.createElement('video');
    v.controls = true;
    v.playsInline = true;
    v.preload = 'none';           // 자동 로딩/재생 없음
    v.src = fig.getAttribute('data-src');
    v.poster = btn.querySelector('img').src;
    fig.innerHTML = '';
    fig.appendChild(v);
    v.play().catch(function () {});
  });

  layout();
  window.addEventListener('resize', layout);
  var imgs = grid.querySelectorAll('img');
  Array.prototype.forEach.call(imgs, function (im) { if (!im.complete) im.addEventListener('load', layout); });
})();
</script>
