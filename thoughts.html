{% include cv-head.html active='thoughts' %}
<main class="sheet">
  <section class="chapter thoughts-list" id="works">
    <h2>짧은 생각</h2>
    {% assign items = site.thoughts | sort: 'date' | reverse %}
    {% for t in items %}
    <a class="row work-row" href="{{ t.url | relative_url }}"><b>{{ t.title }}</b><b class="yr">{{ t.date | date: "%Y.%m.%d" }}</b></a>
    {% endfor %}
  </section>
  <footer class="foot">
    <span>짧은 생각</span>
    <a href="#top">맨 위로 ↑</a>
  </footer>
</main>
