---
layout: cv
---
{% include cv-head.html active='ai' %}
<main class="sheet">
  <article class="thought work">
    <p class="back"><a href="{{ '/ai-lab/' | relative_url }}" aria-label="AI 작업실로 돌아가기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a></p>
    {% assign parts = page.title | split: ' — ' %}
    <h1>{{ parts[0] }}</h1>
    {% if parts.size > 1 %}<p class="subtitle">{{ parts[1] }}</p>{% endif %}
    <p class="meta">{{ page.date | date: "%Y.%m.%d" }}{% if page.tech %} · {{ page.tech }}{% endif %}</p>
    <div class="thought-body">{{ content }}</div>
  </article>
  <footer class="foot">
    <a href="{{ '/ai-lab/' | relative_url }}">← AI 작업실</a>
    <a href="#top">맨 위로 ↑</a>
  </footer>
</main>
