<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  {% if page.draft_page %}<meta name="robots" content="noindex">{% endif %}
  {% assign og_title = page.og_title | default: page.title %}
  {% assign og_desc = page.og_description | default: site.description %}
  <meta name="description" content="{{ og_desc }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="김민지">
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:description" content="{{ og_desc }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/cv.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/assets/images/favicon/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon/favicon-180.png' | relative_url }}">
</head>
<body>
{% comment %}이력서(CV) 레이아웃: 큰 이름 + 줄 단위 표. 스타일은 assets/css/cv.css{% endcomment %}
{{ content }}
<script src="{{ '/assets/js/book.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
